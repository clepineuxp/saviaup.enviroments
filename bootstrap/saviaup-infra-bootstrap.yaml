apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
  labels:
    app.kubernetes.io/name: ingress-nginx
---
apiVersion: v1
kind: Namespace
metadata:
  name: saviaup-dev
  labels:
    app.kubernetes.io/part-of: saviaup
    environment: dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: saviaup-qa
  labels:
    app.kubernetes.io/part-of: saviaup
    environment: qa
---
apiVersion: v1
kind: Namespace
metadata:
  name: saviaup-prod
  labels:
    app.kubernetes.io/part-of: saviaup
    environment: prod
---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: ingress-nginx
  namespace: kube-system
spec:
  chart: ingress-nginx
  repo: https://kubernetes.github.io/ingress-nginx
  targetNamespace: ingress-nginx
  createNamespace: false
  valuesContent: |-
    controller:
      replicaCount: 1

      ingressClass: nginx

      ingressClassResource:
        name: nginx
        enabled: true
        default: true
        controllerValue: k8s.io/ingress-nginx

      service:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Local

      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi

      config:
        use-forwarded-headers: "true"
        compute-full-forwarded-for: "true"

      admissionWebhooks:
        enabled: true
