name: Export QA Manifests via SSH

on:
  push:
    branches:
      - qa
      - main
    paths:
      - 'qa/**'
      - '.github/workflows/deploy-qa.yml'
  workflow_dispatch:

jobs:
  export-to-server:
    name: Export QA Manifests to Remote Server
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python for Variable Substitution
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 3. Replace ${{...}} Placeholders in qa/ Manifests
        env:
          QA_PLATFORMDATABASE_CONNECTIONSTRING: ${{ secrets.QA_PLATFORMDATABASE_CONNECTIONSTRING }}
          QA_APPLICATIONDATABASE_CONNECTIONSTRING: ${{ secrets.QA_APPLICATIONDATABASE_CONNECTIONSTRING }}
          QA_ADMINDATABASE_CONNECTIONSTRING: ${{ secrets.QA_ADMINDATABASE_CONNECTIONSTRING }}
          QA_JWT_SIGNINGKEY: ${{ secrets.QA_JWT_SIGNINGKEY }}
          QA_ADMIN_JWT_SIGNINGKEY: ${{ secrets.QA_ADMIN_JWT_SIGNINGKEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'EOF'
          import os, base64

          replacements = {
              "${{Qa_PlatformDatabase__ConnectionString}}": os.environ.get("QA_PLATFORMDATABASE_CONNECTIONSTRING", ""),
              "${{Qa_ApplicationDatabase__ConnectionString}}": os.environ.get("QA_APPLICATIONDATABASE_CONNECTIONSTRING", ""),
              "${{Qa_AdminDatabase__ConnectionString}}": os.environ.get("QA_ADMINDATABASE_CONNECTIONSTRING", ""),
              "${{Qa_Jwt__SigningKey}}": os.environ.get("QA_JWT_SIGNINGKEY", ""),
              "${{Qa_Admin_Jwt__SigningKey}}": os.environ.get("QA_ADMIN_JWT_SIGNINGKEY", ""),
          }

          # Scan all yaml/yml files in qa directory
          for root, dirs, files in os.walk("qa"):
              for file in files:
                  if file.endswith((".yaml", ".yml")):
                      filepath = os.path.join(root, file)
                      with open(filepath, "r", encoding="utf-8") as f:
                          content = f.read()

                      modified = content
                      for placeholder, value in replacements.items():
                          if value and placeholder in modified:
                              modified = modified.replace(placeholder, value)
                              print(f"Replaced {placeholder} in {filepath}")

                      # Also substitute ghcr credentials if available
                      ghcr_user = os.environ.get("GHCR_USERNAME")
                      ghcr_token = os.environ.get("GHCR_TOKEN")
                      if ghcr_user and ghcr_token and file == "ghcr-secret.yaml":
                          auth_b64 = base64.b64encode(f"{ghcr_user}:{ghcr_token}".encode("utf-8")).decode("utf-8")
                          modified = modified.replace("CHANGE_ME_GITHUB_USER", ghcr_user)
                          modified = modified.replace("CHANGE_ME_GITHUB_PAT", ghcr_token)
                          modified = modified.replace("CHANGE_ME", auth_b64)
                          print(f"Injected GHCR credentials in {filepath}")

                      if modified != content:
                          with open(filepath, "w", encoding="utf-8") as f:
                              f.write(modified)
          EOF

      - name: 4. Ensure Target Directory on Remote Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            mkdir -p /opt/saviaup/deploys/qa

      - name: 5. Copy Manifests to /opt/saviaup/deploys/qa via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "qa/*"
          target: "/opt/saviaup/deploys/qa"
          strip_components: 1
          overwrite: true

      - name: 6. Verify Files on Remote Server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            echo "Manifests successfully exported to /opt/saviaup/deploys/qa:"
            ls -la /opt/saviaup/deploys/qa
