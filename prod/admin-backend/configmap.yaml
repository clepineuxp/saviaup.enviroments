apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-backend-config
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: saviaup
    environment: prod
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Frontend__BaseUrl: "https://admin.saviaup.com"
  Jwt__Issuer: "https://api.admin.saviaup.com"
  Jwt__Audience: "https://admin.saviaup.com"
  Jwt__AccessTokenExpirationMinutes: "30"
  Jwt__RefreshTokenExpirationDays: "7"
  Cors__AllowedOrigins__0: "https://admin.saviaup.com"
  Email__Mode: "Smtp"
  Logging__LogLevel__Default: "Warning"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
