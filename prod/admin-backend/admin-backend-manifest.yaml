apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-backend-config
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: saviaup
    environment: prod
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Frontend__BaseUrl: "https://admin.saviaup.com"
  Jwt__Issuer: "https://admin-api.saviaup.com"
  Jwt__Audience: "https://admin.saviaup.com"
  Jwt__AccessTokenExpirationMinutes: "30"
  Jwt__RefreshTokenExpirationDays: "7"
  Cors__AllowedOrigins__0: "https://admin.saviaup.com"
  Email__Mode: "Development"
  Logging__LogLevel__Default: "Warning"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  Logging__LogLevel__Microsoft.EntityFrameworkCore: "Warning"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-backend
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: saviaup
    environment: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-backend
      app.kubernetes.io/part-of: saviaup
      environment: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-backend
        app.kubernetes.io/part-of: saviaup
        environment: prod
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: admin-backend
          image: ghcr.io/clepineuxp/saviaup-backend-admin:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: admin-backend-config
            - secretRef:
                name: admin-backend-secret
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: admin-backend
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: saviaup
    environment: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: saviaup
    environment: prod
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
