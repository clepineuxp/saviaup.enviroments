apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saviaup-ingress
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/part-of: saviaup
    environment: prod
  annotations:
    ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - saviaup.com
        - www.saviaup.com
        - admin.saviaup.com
      secretName: saviaup-tls
  rules:
    - host: saviaup.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: www.saviaup.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
    - host: admin.saviaup.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-frontend
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: saviaup-api-ingress
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/part-of: saviaup
    environment: prod
  annotations:
    ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.saviaup.com
        - admin-api.saviaup.com
      secretName: saviaup-tls
  rules:
    - host: api.saviaup.com
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: backend
                port:
                  number: 8080
    - host: admin-api.saviaup.com
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: admin-backend
                port:
                  number: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: print-agent-downloads-ingress
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/part-of: saviaup
    environment: prod
  annotations:
    ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - downloads.saviaup.com
      secretName: saviaup-tls
  rules:
    - host: downloads.saviaup.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: print-agent-downloads
                port:
                  number: 80
