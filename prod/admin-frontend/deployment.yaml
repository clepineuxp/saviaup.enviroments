apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: admin-frontend
    app.kubernetes.io/part-of: saviaup
    environment: prod
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-frontend
      app.kubernetes.io/part-of: saviaup
      environment: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-frontend
        app.kubernetes.io/part-of: saviaup
        environment: prod
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: admin-frontend
          image: ghcr.io/clepineuxp/saviaup-frontend-admin:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: admin-frontend-config
            - secretRef:
                name: admin-frontend-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
