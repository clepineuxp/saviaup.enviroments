apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media-storage
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: media-storage
    app.kubernetes.io/part-of: saviaup
    environment: prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: media-server-config
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: media-server
    app.kubernetes.io/part-of: saviaup
    environment: prod
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      access_log off;

      location /pvc/ {
        rewrite ^/pvc/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        types { image/webp webp; }
        default_type application/octet-stream;
      }

      location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-server
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: media-server
    app.kubernetes.io/part-of: saviaup
    environment: prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: media-server
      app.kubernetes.io/part-of: saviaup
      environment: prod
  template:
    metadata:
      labels:
        app.kubernetes.io/name: media-server
        app.kubernetes.io/part-of: saviaup
        environment: prod
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: media
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: media-storage
        - name: config
          configMap:
            name: media-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: media-server
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: media-server
    app.kubernetes.io/part-of: saviaup
    environment: prod
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: media-server
    app.kubernetes.io/part-of: saviaup
    environment: prod
  ports:
    - name: http
      port: 8080
      targetPort: 8080
