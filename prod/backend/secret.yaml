apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: saviaup
    environment: prod
type: Opaque
stringData:
  ConnectionStrings__SaviaUp: "Host=postgres-prod.saviaup-prod.svc.cluster.local;Port=5432;Database=saviaup_prod;Username=saviaup_app;Password=CHANGE_ME_PRODUCTION_DB_PASSWORD"
  Jwt__SigningKey: "CHANGE_ME_PRODUCTION_JWT_SIGNING_KEY_MINIMUM_64_CHARACTERS_LONG"
  Email__Host: "smtp.sendgrid.net"
  Email__Port: "587"
  Email__Username: "apikey"
  Email__Password: "CHANGE_ME_SMTP_PASSWORD"
  Email__FromAddress: "no-reply@saviaup.com"
