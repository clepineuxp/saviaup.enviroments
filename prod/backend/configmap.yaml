apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: saviaup-prod
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: saviaup
    environment: prod
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  Frontend__BaseUrl: "https://saviaup.com"
  Jwt__Issuer: "https://api.saviaup.com"
  Jwt__Audience: "https://saviaup.com"
  Jwt__AccessTokenExpirationMinutes: "30"
  Jwt__RefreshTokenExpirationDays: "7"
  Cors__AllowedOrigins__0: "https://saviaup.com"
  Cors__AllowedOrigins__1: "https://www.saviaup.com"
  Email__Mode: "Smtp"
  Logging__LogLevel__Default: "Warning"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
