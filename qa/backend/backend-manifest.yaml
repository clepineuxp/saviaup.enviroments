apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: saviaup-qa
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: saviaup
    environment: qa
data:
  ASPNETCORE_ENVIRONMENT: "Staging"
  ASPNETCORE_URLS: "http://+:8080"
  Frontend__BaseUrl: "https://qa.saviaup.com"
  Printing__AgentDownloadUrl: "https://qa-downloads.saviaup.com/SaviaUpPrintAgent-Setup.exe"
  Jwt__Issuer: "https://qa-api.saviaup.com"
  Jwt__Audience: "https://qa.saviaup.com"
  Jwt__AccessTokenExpirationMinutes: "60"
  Jwt__RefreshTokenExpirationDays: "7"
  Cors__AllowedOrigins__0: "https://qa.saviaup.com"
  Cors__AllowedOrigins__1: "https://qa-menu.saviaup.com"
  Email__Mode: "Development"
  AdminApi__BaseUrl: "http://admin-backend:8080"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
  Logging__LogLevel__Microsoft.EntityFrameworkCore: "Warning"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: saviaup-qa
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: saviaup
    environment: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
      app.kubernetes.io/part-of: saviaup
      environment: qa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: saviaup
        environment: qa
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/clepineuxp/saviaup-backend:qa
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: saviaup-qa
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: saviaup
    environment: qa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: saviaup
    environment: qa
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
