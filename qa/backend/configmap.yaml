apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: saviaup-qa
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: saviaup
    environment: qa
data:
  ASPNETCORE_ENVIRONMENT: "Staging"
  ASPNETCORE_URLS: "http://+:8080"
  Frontend__BaseUrl: "https://qa.saviaup.com"
  Jwt__Issuer: "https://qa.api.saviaup.com"
  Jwt__Audience: "https://qa.saviaup.com"
  Jwt__AccessTokenExpirationMinutes: "60"
  Jwt__RefreshTokenExpirationDays: "7"
  Cors__AllowedOrigins__0: "https://qa.saviaup.com"
  Email__Mode: "Development"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
