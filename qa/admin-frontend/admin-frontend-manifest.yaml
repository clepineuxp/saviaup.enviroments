apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-frontend-config
  namespace: saviaup-qa
  labels:
    app.kubernetes.io/name: admin-frontend
    app.kubernetes.io/part-of: saviaup
    environment: qa
data:
  API_URL: "https://qa-api-admin.saviaup.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  namespace: saviaup-qa
  labels:
    app.kubernetes.io/name: admin-frontend
    app.kubernetes.io/part-of: saviaup
    environment: qa
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: admin-frontend
      app.kubernetes.io/part-of: saviaup
      environment: qa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-frontend
        app.kubernetes.io/part-of: saviaup
        environment: qa
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: admin-frontend
          image: ghcr.io/clepineuxp/saviaup-frontend-admin:qa
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: admin-frontend-config
            - secretRef:
                name: admin-frontend-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend
  namespace: saviaup-qa
  labels:
    app.kubernetes.io/name: admin-frontend
    app.kubernetes.io/part-of: saviaup
    environment: qa
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: admin-frontend
    app.kubernetes.io/part-of: saviaup
    environment: qa
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
