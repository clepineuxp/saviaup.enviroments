apiVersion: v1
kind: ConfigMap
metadata:
  name: legacy-menu-redirect-config
  namespace: saviaup-dev
  labels:
    app.kubernetes.io/name: legacy-menu-redirect
    app.kubernetes.io/part-of: saviaup
    environment: dev
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;

      location = /healthz {
        return 200 "ok\n";
      }

      location = /m {
        return 308 https://dev-menu.saviaup.com/$is_args$args;
      }

      location ~ ^/m/(.*)$ {
        return 308 https://dev-menu.saviaup.com/$1$is_args$args;
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-menu-redirect
  namespace: saviaup-dev
  labels:
    app.kubernetes.io/name: legacy-menu-redirect
    app.kubernetes.io/part-of: saviaup
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: legacy-menu-redirect
  template:
    metadata:
      labels:
        app.kubernetes.io/name: legacy-menu-redirect
        app.kubernetes.io/part-of: saviaup
        environment: dev
    spec:
      containers:
        - name: redirect
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: config
          configMap:
            name: legacy-menu-redirect-config
---
apiVersion: v1
kind: Service
metadata:
  name: legacy-menu-redirect
  namespace: saviaup-dev
  labels:
    app.kubernetes.io/name: legacy-menu-redirect
    app.kubernetes.io/part-of: saviaup
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: legacy-menu-redirect
  ports:
    - name: http
      port: 80
      targetPort: http
