apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: saviaup-dev
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: saviaup
    environment: dev
data:
  API_URL: "https://dev-api.saviaup.com"
  SIGNALR_URL: "https://dev-api.saviaup.com/hubs"
  MENU_FRONTEND_URL: "https://dev-menu.saviaup.com"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: saviaup-dev
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: saviaup
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
      app.kubernetes.io/part-of: saviaup
      environment: dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: saviaup
        environment: dev
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/clepineuxp/saviaup-frontend:dev
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: frontend-config
            - secretRef:
                name: frontend-secret
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: saviaup-dev
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: saviaup
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: saviaup
    environment: dev
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
