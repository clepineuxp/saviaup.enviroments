apiVersion: v1
kind: ConfigMap
metadata:
  name: admin-backend-config
  namespace: saviaup-dev
  labels:
    app.kubernetes.io/name: admin-backend
    app.kubernetes.io/part-of: saviaup
    environment: dev
data:
  ASPNETCORE_ENVIRONMENT: "Development"
  ASPNETCORE_URLS: "http://+:8080"
  Frontend__BaseUrl: "https://dev.admin.saviaup.com"
  Jwt__Issuer: "https://dev.api.admin.saviaup.com"
  Jwt__Audience: "https://dev.admin.saviaup.com"
  Jwt__AccessTokenExpirationMinutes: "60"
  Jwt__RefreshTokenExpirationDays: "7"
  Cors__AllowedOrigins__0: "https://dev.admin.saviaup.com"
  Email__Mode: "Development"
  Logging__LogLevel__Default: "Information"
  Logging__LogLevel__Microsoft.AspNetCore: "Warning"
