apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: print-agent-downloads
  namespace: saviaup-dev
  labels:
    app.kubernetes.io/name: print-agent-downloads
    app.kubernetes.io/part-of: saviaup
    environment: dev
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: print-agent-downloads-config
  namespace: saviaup-dev
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /downloads;
      default_type application/octet-stream;

      location = /SaviaUpPrintAgent-Setup.exe {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
      }

      location / {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: print-agent-downloads
  namespace: saviaup-dev
  labels:
    app.kubernetes.io/name: print-agent-downloads
    app.kubernetes.io/part-of: saviaup
    environment: dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: print-agent-downloads
  template:
    metadata:
      labels:
        app.kubernetes.io/name: print-agent-downloads
        app.kubernetes.io/part-of: saviaup
        environment: dev
    spec:
      containers:
        - name: downloads
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: downloads
              mountPath: /downloads
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
          readinessProbe:
            httpGet:
              path: /SaviaUpPrintAgent-Setup.exe
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 6
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: print-agent-downloads
        - name: config
          configMap:
            name: print-agent-downloads-config
---
apiVersion: v1
kind: Service
metadata:
  name: print-agent-downloads
  namespace: saviaup-dev
  labels:
    app.kubernetes.io/name: print-agent-downloads
    app.kubernetes.io/part-of: saviaup
    environment: dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: print-agent-downloads
  ports:
    - name: http
      port: 80
      targetPort: http
